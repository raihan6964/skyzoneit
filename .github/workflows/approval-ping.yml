name: approval-ping

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: approval-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger approval cycle
        run: |
          code=$(curl -sS -o approval.json -w "%{http_code}" \
            --max-time 290 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://skyzoneitltd.online/api/cron/verify)
          echo "HTTP $code"
          cat approval.json
          echo
          [ "$code" = "200" ]
